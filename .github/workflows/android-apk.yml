
name: Build Super Player APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          set -e
          test -f Super-Player-Android.zip
          mkdir -p project
          unzip -q Super-Player-Android.zip -d project

      - name: Find Gradle project
        shell: bash
        run: |
          set -e
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Player-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
